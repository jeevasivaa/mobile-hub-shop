{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4">
  <div class="text-center">
    <p class="text-9xl font-black text-gray-100">404</p>
    <h1 class="text-3xl font-bold text-gray-800 mt-4 mb-2">Page Not Found</h1>
    <p class="text-gray-500 mb-8">The page you're looking for doesn't exist or has been moved.</p>
    <div class="flex flex-wrap justify-center gap-4">
      <a href="/" class="bg-primary hover:bg-primary-dark text-white font-semibold px-8 py-3 rounded-full transition-colors shadow hover:shadow-md">
        Go Home
      </a>
      <a href="/products" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold px-8 py-3 rounded-full transition-colors">
        Browse Products
      </a>
    </div>
  </div>
</div>
{% endblock %}
