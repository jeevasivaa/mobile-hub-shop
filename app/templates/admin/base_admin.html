<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Admin{% endblock %} — {{ settings.APP_NAME }}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#6366f1', dark: '#4f46e5', light: '#a5b4fc' },
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <link rel="stylesheet" href="/static/css/custom.css" />
</head>
<body class="bg-gray-100 font-sans antialiased">

<div class="flex min-h-screen">

  <!-- ── Sidebar ──────────────────────────────────────────────────────────── -->
  <aside class="w-64 bg-indigo-900 text-white flex flex-col flex-shrink-0">

    <!-- Brand -->
    <div class="px-6 py-5 border-b border-indigo-800">
      <a href="/admin/dashboard" class="flex items-center gap-2">
        <div class="w-8 h-8 bg-white/10 rounded-lg flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/>
          </svg>
        </div>
        <span class="font-bold text-lg">{{ settings.APP_NAME }}</span>
      </a>
      <p class="text-xs text-indigo-400 mt-1">Admin Panel</p>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-4 py-6 space-y-1">
      <a href="/admin/dashboard"
         class="admin-nav-link {% if 'dashboard' in request.url.path %}active{% endif %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 7h18M3 12h18M3 17h18"/>
        </svg>
        Dashboard
      </a>
      <a href="/admin/products"
         class="admin-nav-link {% if 'products' in request.url.path %}active{% endif %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/>
        </svg>
        Products
      </a>
      <a href="/admin/offers"
         class="admin-nav-link {% if 'offers' in request.url.path %}active{% endif %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
        </svg>
        Offers
      </a>
      <a href="/admin/enquiries"
         class="admin-nav-link {% if 'enquiries' in request.url.path %}active{% endif %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
        Enquiries
      </a>
    </nav>

    <!-- Logout -->
    <div class="px-4 pb-6">
      <form method="post" action="/admin/logout">
        <button type="submit"
          class="w-full flex items-center gap-2 text-indigo-300 hover:text-white hover:bg-indigo-800 px-3 py-2.5 rounded-lg transition-colors text-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          Logout
        </button>
      </form>
      <p class="text-xs text-indigo-500 mt-3 text-center">{{ admin.username }}</p>
    </div>
  </aside>

  <!-- ── Main Content ────────────────────────────────────────────────────── -->
  <div class="flex-1 flex flex-col overflow-hidden">

    <!-- Top bar -->
    <header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold text-gray-800">{% block page_heading %}{% endblock %}</h1>
      <a href="/" target="_blank"
         class="text-sm text-primary hover:text-primary-dark font-medium flex items-center gap-1">
        View Site ↗
      </a>
    </header>

    <!-- Content -->
    <main class="flex-1 overflow-y-auto p-6">
      {% block admin_content %}{% endblock %}
    </main>
  </div>
</div>

<script src="/static/js/app.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
