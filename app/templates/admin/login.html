<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — {{ settings.APP_NAME }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: { DEFAULT: '#6366f1', dark: '#4f46e5' } },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-900 to-purple-900 font-sans flex items-center justify-center px-4">

  <div class="w-full max-w-sm">
    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-2xl p-8">
      <!-- Logo -->
      <div class="text-center mb-8">
        <div class="w-14 h-14 bg-gradient-to-br from-primary to-primary-dark rounded-2xl flex items-center justify-center mx-auto mb-4">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-extrabold text-gray-900">{{ settings.APP_NAME }}</h1>
        <p class="text-sm text-gray-500 mt-1">Admin Panel Login</p>
      </div>

      <!-- Error message -->
      {% if error %}
      <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl flex items-center gap-2">
        <span>⚠️</span> {{ error }}
      </div>
      {% endif %}

      <!-- Login Form -->
      <form method="post" action="/admin/login" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="login-username">
            Username
          </label>
          <input type="text" id="login-username" name="username" required autofocus
            placeholder="admin"
            class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="login-password">
            Password
          </label>
          <input type="password" id="login-password" name="password" required
            placeholder="••••••••"
            class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
        </div>

        <button type="submit"
          class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-3 rounded-xl transition-all duration-200 shadow hover:shadow-md mt-2">
          Sign In →
        </button>
      </form>

      <div class="mt-6 text-center">
        <a href="/" class="text-sm text-gray-500 hover:text-primary transition-colors">← Back to website</a>
      </div>
    </div>
  </div>

</body>
</html>
