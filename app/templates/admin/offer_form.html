{% extends "admin/base_admin.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block page_heading %}{{ page_title }}{% endblock %}

{% block admin_content %}
<div class="max-w-2xl">
  {% if error %}
  <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl">⚠️ {{ error }}</div>
  {% endif %}

  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
    <form method="post" enctype="multipart/form-data" class="space-y-5">

      <div>
        <label class="form-label" for="offer-title">Offer Title *</label>
        <input type="text" id="offer-title" name="title" required
          value="{{ offer.title if offer else '' }}"
          placeholder="e.g. Diwali Sale — 20% Off All iPhones"
          class="form-input" />
      </div>

      <div>
        <label class="form-label" for="offer-desc">Description</label>
        <textarea id="offer-desc" name="description" rows="3"
          placeholder="Describe the offer details..."
          class="form-input resize-none">{{ offer.description if offer else '' }}</textarea>
      </div>

      <div>
        <label class="form-label" for="offer-discount">Discount Percentage *</label>
        <input type="number" id="offer-discount" name="discount_percentage"
          required min="0" max="100" step="0.1"
          value="{{ offer.discount_percentage if offer else '' }}"
          placeholder="20"
          class="form-input" />
      </div>

      <div class="flex items-center gap-3">
        <input type="checkbox" id="offer-active" name="active" value="on"
          {% if not offer or offer.active %}checked{% endif %}
          class="w-4 h-4 rounded border-gray-300 text-primary focus:ring-primary" />
        <label class="text-sm font-medium text-gray-700" for="offer-active">
          Active (show on public site)
        </label>
      </div>

      <div>
        <label class="form-label" for="offer-image">Offer Image</label>
        {% if offer and offer.image %}
          <div class="mb-2">
            <img src="{{ offer.image }}" alt="Current image"
                 class="w-32 h-20 object-cover rounded-lg border border-gray-200" />
            <p class="text-xs text-gray-400 mt-1">Upload new to replace.</p>
          </div>
        {% endif %}
        <input type="file" id="offer-image" name="image" accept="image/*"
          class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4
                 file:rounded-lg file:border-0 file:text-sm file:font-semibold
                 file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100" />
      </div>

      <div class="flex gap-3 pt-2">
        <button type="submit"
          class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-8 py-3 rounded-xl transition-colors shadow">
          {{ 'Update Offer' if offer else 'Add Offer' }}
        </button>
        <a href="/admin/offers"
          class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold px-8 py-3 rounded-xl transition-colors">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
