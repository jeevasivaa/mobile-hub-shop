<!-- components/navbar.html -->
<nav class="sticky top-0 z-50 bg-white/95 backdrop-blur-sm shadow-sm border-b border-gray-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">

      <!-- Logo -->
      <a href="/" class="flex items-center gap-2 group">
        <div class="w-8 h-8 bg-gradient-to-br from-primary to-primary-dark rounded-lg flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/>
          </svg>
        </div>
        <span class="text-xl font-bold bg-gradient-to-r from-primary to-primary-dark bg-clip-text text-transparent">
          {{ settings.APP_NAME }}
        </span>
      </a>

      <!-- Desktop Menu -->
      <div class="hidden md:flex items-center gap-1">
        <a href="/"        class="nav-link {% if request.url.path == '/' %}active{% endif %}">Home</a>
        <a href="/products" class="nav-link {% if '/products' in request.url.path %}active{% endif %}">Products</a>
        <a href="/offers"   class="nav-link {% if '/offers' in request.url.path %}active{% endif %}">Offers</a>
        <a href="/about"    class="nav-link {% if '/about' in request.url.path %}active{% endif %}">About</a>
        <a href="/contact"  class="nav-link {% if '/contact' in request.url.path %}active{% endif %}">Contact</a>
      </div>

      <!-- WhatsApp CTA + Mobile Menu Button -->
      <div class="flex items-center gap-3">
        <a href="https://wa.me/{{ settings.WHATSAPP_NUMBER | replace('+','') }}"
           target="_blank"
           class="hidden sm:flex items-center gap-2 bg-green-500 hover:bg-green-600 text-white text-sm font-medium px-4 py-2 rounded-full transition-all duration-200 shadow-sm hover:shadow-md">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
          </svg>
          WhatsApp
        </a>

        <!-- Mobile hamburger -->
        <button id="mobile-menu-btn" onclick="toggleMobileMenu()"
          class="md:hidden p-2 rounded-lg text-gray-600 hover:bg-gray-100 transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div id="mobile-menu" class="hidden md:hidden border-t border-gray-100 bg-white">
    <div class="px-4 py-3 space-y-1">
      <a href="/"         class="mobile-nav-link">Home</a>
      <a href="/products" class="mobile-nav-link">Products</a>
      <a href="/offers"   class="mobile-nav-link">Offers</a>
      <a href="/about"    class="mobile-nav-link">About</a>
      <a href="/contact"  class="mobile-nav-link">Contact</a>
      <a href="https://wa.me/{{ settings.WHATSAPP_NUMBER | replace('+','') }}"
         target="_blank"
         class="flex items-center gap-2 text-green-600 font-medium py-2">
        📱 WhatsApp Us
      </a>
    </div>
  </div>
</nav>
