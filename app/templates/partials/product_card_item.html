<!-- partials/product_card_item.html -->
<!-- Reusable single product card used by index.html and product_cards.html -->
<div class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-lg transition-all duration-300 group border border-gray-100">
  <a href="/products/{{ product.id }}">
    <!-- Product Image -->
    <div class="relative h-44 bg-gradient-to-br from-gray-100 to-gray-200 overflow-hidden">
      {% if product.image %}
        <img src="{{ product.image }}" alt="{{ product.name }}"
             class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
      {% else %}
        <div class="w-full h-full flex items-center justify-center">
          <svg class="w-16 h-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/>
          </svg>
        </div>
      {% endif %}

      <!-- Stock badge -->
      {% if product.stock == 0 %}
        <span class="absolute top-2 left-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full">Out of Stock</span>
      {% elif product.stock <= 3 %}
        <span class="absolute top-2 left-2 bg-orange-500 text-white text-xs font-bold px-2 py-1 rounded-full">Only {{ product.stock }} left</span>
      {% endif %}
    </div>
  </a>

  <!-- Product Info -->
  <div class="p-4">
    <p class="text-xs font-semibold text-primary uppercase tracking-wide mb-1">{{ product.brand }}</p>
    <a href="/products/{{ product.id }}">
      <h3 class="font-bold text-gray-900 text-sm leading-tight mb-2 group-hover:text-primary transition-colors line-clamp-2">
        {{ product.name }}
      </h3>
    </a>
    <div class="flex items-center justify-between mt-3">
      <span class="text-lg font-extrabold text-gray-900">₹{{ "{:,.0f}".format(product.price) }}</span>
      <a href="https://wa.me/{{ settings.WHATSAPP_NUMBER | replace('+','') }}?text=Hi%2C%20I%27m%20interested%20in%20{{ product.name | urlencode }}"
         target="_blank"
         class="text-xs bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 rounded-full font-medium transition-colors">
        Enquire
      </a>
    </div>
  </div>
</div>
