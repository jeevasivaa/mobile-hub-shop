{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

  <!-- Page Header -->
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-900">Our Products</h1>
    <p class="text-gray-500 mt-1">Browse {{ products | length }} phone{{ 's' if products | length != 1 else '' }} from top brands</p>
  </div>

  <!-- Search + Filter Bar -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-8">
    <div class="flex flex-col sm:flex-row gap-4">

      <!-- Search input with HTMX -->
      <div class="relative flex-1">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input
          id="search-input"
          type="text"
          name="q"
          value="{{ query }}"
          placeholder="Search phones by name or brand..."
          class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary text-sm"
          hx-get="/products"
          hx-trigger="keyup changed delay:400ms"
          hx-target="#product-grid"
          hx-include="#brand-select"
          hx-indicator="#loading-spinner"
        />
      </div>

      <!-- Brand filter -->
      <select
        id="brand-select"
        name="brand"
        class="px-4 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary text-sm bg-white"
        hx-get="/products"
        hx-trigger="change"
        hx-target="#product-grid"
        hx-include="#search-input"
        hx-indicator="#loading-spinner"
      >
        <option value="all" {% if not selected_brand %}selected{% endif %}>All Brands</option>
        {% for brand in brands %}
          <option value="{{ brand }}" {% if selected_brand == brand %}selected{% endif %}>{{ brand }}</option>
        {% endfor %}
      </select>
    </div>

    <!-- Loading indicator (hidden by default, shown during HTMX requests) -->
    <div id="loading-spinner" class="htmx-indicator mt-3 flex items-center gap-2 text-sm text-primary">
      <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
      </svg>
      Searching...
    </div>
  </div>

  <!-- Product Grid — HTMX target -->
  <div id="product-grid">
    {% include "partials/product_cards.html" %}
  </div>

</div>
{% endblock %}
