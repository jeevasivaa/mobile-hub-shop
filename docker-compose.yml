version: "3.9"

services:

  # ── FastAPI Application ─────────────────────────────────────────────
  app:
    build: .
    container_name: mobileshop_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Override with actual Supabase values in production
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      APP_NAME: ${APP_NAME:-MobileHub}
      DEBUG: ${DEBUG:-False}
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-+910000000000}
      SHOP_ADDRESS: ${SHOP_ADDRESS:-123 Main Street, City}
      GOOGLE_MAPS_EMBED_URL: ${GOOGLE_MAPS_EMBED_URL:-https://maps.google.com/maps?q=india&output=embed}
      UPLOAD_DIR: app/static/uploads
    volumes:
      # Persist uploaded images between container restarts
      - ./app/static/uploads:/app/app/static/uploads
    depends_on:
      - db
    networks:
      - mobileshop_net

  # ── Local PostgreSQL (for development only) ──────────────────────────
  # In production, replace with Supabase DATABASE_URL and remove this service.
  db:
    image: postgres:15-alpine
    container_name: mobileshop_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mobileshop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mobileshop_net

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: mobileshop_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static:/app/static:ro
    depends_on:
      - app
    networks:
      - mobileshop_net

volumes:
  postgres_data:

networks:
  mobileshop_net:
    driver: bridge
