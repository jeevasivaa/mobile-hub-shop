# nginx/default.conf
# Nginx reverse proxy configuration for the Mobile Shop app.
# Proxies all requests to the FastAPI app running on port 8000.
# Serves static files directly for better performance.

server {
    listen 80;
    server_name _;  # Accept all hostnames; replace with your domain in production

    # ── Security Headers ────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    client_max_body_size 10M;  # Allow up to 10MB file uploads

    # ── Serve Static Files Directly (faster than proxying) ──────────────
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Proxy All Other Requests to FastAPI ─────────────────────────────
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTMX and form submissions need this
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Health Check Endpoint ────────────────────────────────────────────
    location /health {
        proxy_pass http://app:8000/health;
        access_log off;
    }
}
